<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congratulazioni</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f0f2f5; padding: 20px 0; }
    .card { background: white; padding: 35px 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; max-width: 380px; width: 85%; }
    
    /* Logo du haut */
    .logo-box { width: 140px; margin: 0 auto 20px auto; }
    .logo-img { max-width: 100%; height: auto; display: block; margin: 0 auto; }

    h1 { color: #1c1e21; font-size: 22px; margin-bottom: 10px; font-weight: 700; }
    p { color: #606770; font-size: 15px; margin-bottom: 25px; line-height: 1.5; }
    
    /* Bouton WhatsApp */
    .btn-whatsapp { background-color: #25D366; color: white; padding: 14px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 16px; display: inline-block; transition: background-color 0.2s; width: 85%; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
    .btn-whatsapp:hover { background-color: #1ebd59; }

    /* Tampon du bas */
    .tampon-box { margin-top: 25px; border-top: 1px solid #f0f0f0; padding-top: 20px; }
    .tampon-img { max-width: 120px; height: auto; margin: 0 auto; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Logo 01.jpg -->
    <div class="logo-box">
      <img src="01.jpg" alt="Eurofinanza" class="logo-img">
    </div>

    <h1>Congratulazioni!</h1>
    <p>La tua richiesta di prestito è stata approvata, Conferma la tua candidatura pagando la quota di registrazione e sblocco fondi di €79.</p>
    
    <!-- WhatsApp -->
    <a href="https://wa.me/33773752320?text=Voglio%20sbloccare%20i%20miei%20fondi" class="btn-whatsapp" target="_blank">
      Invia "I miei fondi" su WhatsApp
    </a>

    <!-- Tampon 02.jpg -->
    <div class="tampon-box">
      <img src="02.jpg" alt="Approved" class="tampon-img">
    </div>
  </div>
</body>
</html>
